syntax = "proto3";
package Protocol;


enum PacketId {
    PKT_NONE = 0;
    PKT_CS_LOGIN = 1;         
    PKT_SC_LOGIN_OK = 2;      
    PKT_CS_CHAT = 3;          
    PKT_SC_CHAT_BROADCAST = 4; 
    PKT_SC_WHISPER = 5;           
    PKT_CS_WHISPER = 6;         
    PKT_CS_MOVING = 7;           
    PKT_SC_MOVING = 8;
    PKT_CS_ENTER_GAME = 9;
    PKT_SC_ENTER_GAME = 10;
    PKT_SC_PLAYER_SPAWN = 11; 
    PKT_CS_GAME_READY = 12;
    PKT_SC_PLAYER_DESPAWN = 13;
    PKT_CS_SKILL = 14;
    PKT_SC_SKILL = 15;
    PKT_SC_CHANGE_HP = 16;
    PKT_SC_CHANGE_MP = 17;
    PKT_SC_MONSTER_SPAWN = 18;
    PKT_SC_MONSTER_DEAD = 19;
    PKT_CS_OWNED_ITEM_REQUEST = 20;
    PKT_SC_ITEM_RESPONSE = 21;
    PKT_CS_QUEST_CREATED_REQUEST = 22;
    PKT_SC_QUEST_CREATED_RESPONSE = 23;
    PKT_CS_QUEST_ACCEPT_REQUEST = 24;
    PKT_SC_QUEST_ACCEPT_RESPONSE = 25;
    PKT_SC_QUEST_PROGRESS_UPDATE = 26;
    PKT_CS_QUEST_LIST_REQUEST = 27;
    PKT_SC_QUEST_LIST_RESPONSE = 28;
    
}


message CS_LOGIN {
    string token = 1;
    int32 characterId = 2;
}



message SC_LOGIN_OK {
    bool success = 1;
    int32 player_id = 2; 
    string error_message = 3;

}


message CS_CHAT {
    string msg = 1;
}


message SC_CHAT_BROADCAST {
    int32 player_id = 1;
    string msg = 2;
}


message SC_WHISPER {
    int32 fromplayer_id = 1;   
    string msg = 2;      
}


message CS_WHISPER  
{
    int32 targetplayer_id = 1;
    string msg = 2;
}

message PosInfo {
  int32 object_id = 1; // 이동하는 대상의 ID
  float x = 2;
  float y = 3;
  float z = 4;
  float yaw = 5;       // 바라보는 방향 (회전)
  int32 state = 6;
}

message StatInfo {
    int32 object_id = 1;
    string name = 2;
    int32 hp = 3;
    int32 attack = 4;
    int32 speed = 5;
    int32 level = 6;
}
message CS_MOVING {
    PosInfo pos_info = 1;
}


message SC_MOVING {
    repeated PosInfo pos_info = 1;
}

message CS_ENTER_GAME {

}

message SC_ENTER_GAME {
    PosInfo pos_info = 1;
    int32 templateId = 2;
    int32 MapId = 3;
}

message SC_PLAYER_SPAWN {
    repeated SpawnInfo players_spawn_info = 1;
    
}

message SpawnInfo
{
    PosInfo spawnposinfo = 1;
    int32 templateId = 2;
}

message CS_GAME_READY {
    int32 player_id = 1;
}

message SC_PLAYER_DESPAWN  {
    repeated int32 player_id = 1;
}

message CS_SKILL {
    int32 skill_id = 1;

  // 스킬 타입별로 필요한 '추가 정보'만 묶어서 관리
  oneof extra_info {
    TargetobjectInfo target = 2;      // 근접/타겟팅용 (대상 ID)
    TargetPosInfo dest_pos = 3;  // 논타겟/이동기용 (목표 좌표)
  }
}

message SC_SKILL {
  int32 object_id = 1;
  int32 skill_id = 2;
  oneof extra_info {
    TargetobjectInfo target = 3; // 근접/타겟팅용 (대상 ID)
    TargetPosInfo dest_pos = 4;  // 논타겟/이동기용 (목표 좌표)
  }
}

message SC_CHANGE_HP {
  int32 object_id = 1;
  int32 current_hp = 2;
  int32 damage = 3;
  int32 attacker_id = 4;
}


message TargetobjectInfo {
    int32 target_object_id = 1;
}

message TargetPosInfo{
    float x = 1;
    float y = 2;
    float z = 3;
}

message SC_CHANGE_MP {
  int32 object_id = 1;
  int32 current_mp = 2;
  
}

message SC_MONSTER_SPAWN {
    repeated SpawnInfo monsters_spawn_info = 1;
}

message SC_MONSTER_DEAD {
    repeated int32 dead_object_id_list = 1;
}

message CS_OWNED_ITEM_REQUEST {
    int32 player_id = 1; //자기 자신의 objectID(playerId)를 확인용으로 전송
}

message SC_ITEM_RESPONSE {
    repeated ItemInfo items = 1;
}

message ItemInfo 
{
    int32 Dbid = 1; 
    int32 TemplateId = 2;
    int32 Count = 3;
    int32 Slot = 4;
    string item_memo = 5;
}

message QuestInfo {
  int32 quest_id = 1;         // 고유 ID, 서버 id
  int32 quest_templateId = 2; // 템플릿 id  (json 파일에서의 id) 
  int32 quest_type_id = 3;    // QuestType (예: 1 - Kill)
  int32 state = 4;            // QuestState (1: Accepted, 2: Completed, 3: RewardReceived)
  
  int32 client_object_id = 5; // 발급자 Creature의 Object ID (NPC/Monster/Player)
  int32 acquirer_object_id = 6;// 수행자 Creature의 Object ID
  // 퀘스트 수행 목표 데이터 (동적 생성 지원용)
  int32 target_template_id = 7;        // 처치 대상 몬스터 ID 또는 타겟 아이템 ID 등 (templateId)
  int32 current_count = 8;    // 현재 진행량 (예: 1마리 잡음)
  int32 target_count = 9;     // 목표량 (예: 5마리 채워야 함)
  // 보상 데이터
  int32 reward_type_id = 10;   // RewardType (1: Exp, 2: Item, 3: Gold)
  int32 reward_value = 11;    // 보상 골드량, 경험치량 또는 아이템 개수
  int32 reward_item_id = 12;  // 보상 아이템 템플릿 ID

  string name = 13;
}

message CS_QUEST_CREATED_REQUEST 
{
    QuestInfo req_create_quest_info =1; 
}

message SC_QUEST_CREATED_RESPONSE
{
    bool success = 1;
    QuestInfo res_create_quest_info = 2;
}

message CS_QUEST_ACCEPT_REQUEST
{
    int32 quest_id = 1;
    int32 quest_client_object_id =2;
}

message SC_QUEST_ACCEPT_RESPONSE
{
    bool success = 1;
    QuestInfo res_accept_quest = 2;
}

message SC_QUEST_PROGRESS_UPDATE 
{
    QuestInfo prossing_quest = 1;
}

message CS_QUEST_LIST_REQUEST
{
    int32 quest_client_object_id = 1;
}

message SC_QUEST_LIST_RESPONSE
{
    repeated QuestInfo quests = 1;
}